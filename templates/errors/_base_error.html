{% extends "base.html" %}
{% block content %}
<div class="container" style="min-height: 55vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 60px 20px;">
    <div style="font-size: 5em; font-weight: 800; color: var(--primary, #1A4D2E); line-height:1;">{{ code }}</div>
    <h1 style="margin: 10px 0;">{{ title }}</h1>
    <p style="color:#666; max-width: 480px;">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn-primary" style="margin-top: 20px; padding: 12px 28px; border-radius: 10px; text-decoration:none; background: var(--primary, #1A4D2E); color:#fff;">
        Volver al inicio
    </a>
</div>
{% endblock %}
