{% extends "base.html" %}
{% block title %}Mi Perfil - CoAgrix{% endblock %}
{% block content %}<div class="container" style="padding:40px 0;max-width:600px"><div class="section-header"><h2>Mi Perfil</h2><p>Actualiza tu información de cuenta.</p></div><form method="POST" class="feature-card glass" style="padding:30px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div style="margin-bottom:18px"><label>Nombre</label><input type="text" name="nombre" value="{{ user.nombre }}" required style="width:100%;padding:10px"></div><div style="margin-bottom:18px"><label>Correo</label><input type="email" name="email" value="{{ user.email }}" required style="width:100%;padding:10px"></div>{% if merchant %}<div style="margin-bottom:18px"><label>Teléfono</label><input type="tel" name="telefono" value="{{ merchant.telefono or '' }}" style="width:100%;padding:10px"></div>{% endif %}<button class="btn-primary" type="submit">Guardar cambios</button> <a href="{{ url_for('account.change_password_route') }}" class="btn-outline" style="margin-left:10px">Cambiar contraseña</a></form></div>{% endblock %}
