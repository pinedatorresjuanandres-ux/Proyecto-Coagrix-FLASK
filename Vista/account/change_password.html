{% extends "base.html" %}
{% block title %}Cambiar contraseña - CoAgrix{% endblock %}
{% block content %}
<div class="container" style="padding:40px 0;max-width:600px">
    <div class="section-header"><h2>Cambiar contraseña</h2><p>Por seguridad, primero confirma tu contraseña actual.</p></div>
    <form method="POST" class="feature-card glass" style="padding:30px">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:18px"><label>Contraseña actual</label><input type="password" name="password_actual" required autocomplete="current-password" style="width:100%;padding:10px"></div>
        <div style="margin-bottom:18px"><label>Nueva contraseña</label><input type="password" name="password" minlength="8" required autocomplete="new-password" style="width:100%;padding:10px"><small style="color:#777">Mínimo 8 caracteres y una mayúscula.</small></div>
        <div style="margin-bottom:18px"><label>Confirmar nueva contraseña</label><input type="password" name="password_confirm" required autocomplete="new-password" style="width:100%;padding:10px"></div>
        <button class="btn-primary" type="submit">Actualizar contraseña</button>
        <a href="{{ url_for('account.profile_route') }}" class="btn-outline" style="margin-left:10px">Cancelar</a>
    </form>
</div>
{% endblock %}
