{# Desplegables encadenados de Departamento -> Municipio (Colombia).
   Requiere la variable `ubicaciones` = {departamento: [municipios]}; los
   valores enviados (name="departamento" / name="municipio") son el texto
   tal cual se guardará en la tabla `ubicaciones`. #}
<div class="input-group">
  <label for="departamento">Departamento</label>
  <select id="departamento" name="departamento" required>
    <option value="" selected disabled>Selecciona un departamento</option>
    {% for dep in ubicaciones %}
    <option value="{{ dep }}">{{ dep }}</option>
    {% endfor %}
  </select>
</div>
<div class="input-group">
  <label for="municipio">Municipio</label>
  <select id="municipio" name="municipio" required disabled>
    <option value="" selected disabled>Primero elige un departamento</option>
  </select>
</div>
<script type="application/json" id="ubicaciones-data">{{ ubicaciones|tojson }}</script>
<script>
  (function () {
    var data = JSON.parse(document.getElementById('ubicaciones-data').textContent);
    var dep = document.getElementById('departamento');
    var mun = document.getElementById('municipio');

    dep.addEventListener('change', function () {
      var municipios = data[dep.value] || [];
      mun.innerHTML = '';
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.selected = true;
      placeholder.textContent = 'Selecciona un municipio';
      mun.appendChild(placeholder);
      municipios.forEach(function (nombre) {
        var opt = document.createElement('option');
        opt.value = nombre;
        opt.textContent = nombre;
        mun.appendChild(opt);
      });
      mun.disabled = municipios.length === 0;
    });
  })();
</script>
